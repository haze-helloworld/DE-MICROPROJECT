name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  # ── Daily ingestion (runs on schedule or manual trigger) ──────────────────────
  ingest:
    name: Daily GitHub Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      GITHUB_TOKEN:               ${{ secrets.GH_PAT }}
      SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:             ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: pip install requests snowflake-connector-python cryptography python-dotenv

      - name: Write Snowflake private key
        env:
          KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if echo "$KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$KEY_B64" > /tmp/rsa_key.p8
          else
            echo "$KEY_B64" | base64 -d > /tmp/rsa_key.p8
          fi
          chmod 600 /tmp/rsa_key.p8

      - name: Run extractor
        run: python ingestion/extractor.py

  # ── dbt build ─────────────────────────────────────────────────────────────────
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    needs: [ingest]
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    env:
      SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: pip install dbt-core dbt-snowflake

      # Write the private key from the secret to a temp file
      - name: Write Snowflake private key
        env:
          KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if echo "$KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$KEY_B64" > /tmp/rsa_key.p8
          else
            echo "$KEY_B64" | base64 -d > /tmp/rsa_key.p8
          fi
          chmod 600 /tmp/rsa_key.p8

      # Set up dbt profiles
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt_project/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        run: cd dbt_project && dbt deps

      - name: dbt build (dev)
        run: cd dbt_project && dbt build --target dev

      # On merge to main or manual dispatch, also deploy to prod
      - name: dbt build (prod)
        if: github.ref == 'refs/heads/main'
        run: cd dbt_project && dbt build --target prod

