name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'

jobs:
  # ── Lint SQL ──────────────────────────────────────────────────────────────────
  lint:
    name: SQLFluff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install sqlfluff
      - run: sqlfluff lint dbt_project/models/ --dialect snowflake

  # ── dbt build ─────────────────────────────────────────────────────────────────
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    needs: lint
    env:
      SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: pip install dbt-core dbt-snowflake

      # Write the private key from the secret to a temp file
      - name: Write Snowflake private key
        run: echo '${{ secrets.SNOWFLAKE_PRIVATE_KEY }}' > /tmp/rsa_key.p8

      # Set up dbt profiles
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp dbt_project/profiles.yml.example ~/.dbt/profiles.yml

      - name: dbt deps
        run: cd dbt_project && dbt deps

      - name: dbt build (dev)
        run: cd dbt_project && dbt build --target dev

      # On merge to main, also deploy to prod
      - name: dbt build (prod)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cd dbt_project && dbt build --target prod

  # ── Daily ingestion (only on schedule trigger) ────────────────────────────────
  ingest:
    name: Daily GitHub ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      GITHUB_TOKEN:               ${{ secrets.GH_PAT }}
      SNOWFLAKE_ACCOUNT:          ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:             ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install dependencies
        run: pip install requests snowflake-connector-python cryptography python-dotenv

      - name: Write Snowflake private key
        run: echo '${{ secrets.SNOWFLAKE_PRIVATE_KEY }}' > /tmp/rsa_key.p8

      - name: Run extractor
        run: python ingestion/extractor.py

