version: '3.8'

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-snowflake==1.8.4 snowflake-connector-python==3.12.3 apache-airflow-providers-airbyte requests python-dotenv"
    SNOWFLAKE_ACCOUNT: "${SNOWFLAKE_ACCOUNT}"
    SNOWFLAKE_USER: "${SNOWFLAKE_USER}"
    SNOWFLAKE_PRIVATE_KEY_PATH: "/opt/airflow/keys/rsa_key.p8"
    GITHUB_TOKEN: "${GITHUB_TOKEN}"
    AIRBYTE_HOST: "airbyte-server"
    AIRBYTE_PORT: "8001"
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - ./rsa_key.p8:/opt/airflow/keys/rsa_key.p8:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── PostgreSQL for Airflow Metadata ────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ── Airflow Webserver (UI on port 8080) ────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # ── Airflow Scheduler ─────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always

  # ── Airflow Database Initializer ──────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Tanvi \
          --lastname Admin \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: on-failure

  # ── Conversational BI & Visuals (Streamlit) ───────────────
  conversational-bi:
    image: python:3.11-slim
    container_name: conversational-bi
    working_dir: /app
    volumes:
      - .:/app
    environment:
      SNOWFLAKE_ACCOUNT: "${SNOWFLAKE_ACCOUNT}"
      SNOWFLAKE_USER: "${SNOWFLAKE_USER}"
      SNOWFLAKE_PRIVATE_KEY_PATH: "/app/rsa_key.p8"
    command:
      - /bin/bash
      - -c
      - |
        pip install streamlit snowflake-connector-python cryptography pandas plotly python-dotenv &&
        streamlit run bi/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  postgres-db-volume:
